<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Telfast Games Hub</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    @font-face {
      font-family: 'Opella';
      src: local('Opella'), local('Opella-Regular');
    }

    :root {
      --bg: transparent; 
      --surface: rgba(99, 1, 112, 0.5); 
      --border: rgba(247, 167, 6, 0.45);
      --text: #ffffff;
      --muted: #e2d6ed;
      --primary: #630170;
      --accent: #f7a706;
      --icon-bg: rgba(255, 255, 255, 0.08);
      --icon-border: rgba(247, 167, 6, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Opella', 'Poppins', sans-serif;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      background: url('assets/bg.jpg') no-repeat center center fixed;
      background-size: cover;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    .main-wrapper {
      width: 100vw;
      min-height: 100vh;
      max-width: 1080px;
      max-height: 1920px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 40px 24px 30px;
      box-sizing: border-box;
    }

    .header {
      text-align: center;
      padding: 20px 20px;
      width: 100%;
    }

    .logos-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 25px;
      margin-bottom: 25px;
      flex-wrap: wrap;
    }

    .app-logo {
      max-width: 280px;
      max-height: 110px;
      object-fit: contain;
      filter: drop-shadow(0 6px 15px rgba(0,0,0,0.6));
    }

    .opella-logo {
      max-height: 60px;
      object-fit: contain;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.6));
    }

    .page-title {
      font-size: 3.5rem;
      font-weight: 900;
      color: var(--text);
      margin-bottom: 10px;
      text-shadow: 0 4px 20px rgba(99, 1, 112, 0.9);
      letter-spacing: 1px;
    }

    .page-sub {
      color: var(--muted);
      font-size: 1.3rem;
      font-weight: 400;
    }

    .container {
      width: 100%;
      max-width: 960px;
      margin: auto 0;
      animation: fadeIn 0.4s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 30px;
      width: 100%;
    }

    .game-card {
      background: var(--surface);
      border: 2px solid var(--border);
      backdrop-filter: blur(14px);
      border-radius: 24px;
      padding: 36px 20px;
      text-align: center;
      cursor: pointer;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: all 0.3s ease-in-out;
      box-shadow: 0 8px 30px rgba(0,0,0,0.5);
    }

    .game-card:hover {
      transform: translateY(-8px) scale(1.02);
      border-color: var(--accent);
      background: rgba(99, 1, 112, 0.75);
      box-shadow: 0 15px 40px rgba(247, 167, 6, 0.35);
    }

    .game-icon-wrap {
      width: 120px;
      height: 100px;
      background: var(--icon-bg);
      border: 2px solid var(--icon-border);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      padding: 12px;
      transition: all 0.3s ease-in-out;
    }

    .game-card:hover .game-icon-wrap {
      background: rgba(247, 167, 6, 0.15);
      border-color: var(--accent);
      transform: scale(1.08);
    }

    .game-icon {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4));
    }

    .game-title {
      color: var(--text);
      font-weight: 800;
      font-size: 1.4rem;
      line-height: 1.4;
      margin-bottom: 22px;
      flex-grow: 1;
    }

    .play-badge {
      background: linear-gradient(135deg, #f7a706, #d98e00);
      color: #3b0043;
      font-size: 1.15rem;
      font-weight: 900;
      padding: 12px 34px;
      border-radius: 50px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      transition: all 0.25s ease-in-out;
      box-shadow: 0 6px 18px rgba(247, 167, 6, 0.4);
    }

    .game-card:hover .play-badge { 
      transform: scale(1.06);
      box-shadow: 0 8px 24px rgba(247, 167, 6, 0.7);
    }

    .footer-disclaimer {
      width: 100%;
      text-align: center;
      color: rgba(255, 255, 255, 0.4);
      font-size: 12px;
      pointer-events: none;
    }

    @media (max-width: 600px) {
      .games-grid {
        grid-template-columns: 1fr;
        gap: 20px;
      }
      .page-title { font-size: 2.5rem; }
      .game-title { font-size: 1.2rem; }
      .game-icon-wrap { width: 100px; height: 80px; }
    }
  </style>
</head>
<body>

  <div class="main-wrapper">
    <header class="header">
      <div class="logos-row">
        <img src="assets/telfast_logo.png" alt="Telfast Logo" class="app-logo">
        <img src="assets/opella_logo.png" alt="Opella Logo" class="opella-logo">
      </div>
      <h1 class="page-title">Games Hub</h1>
      <p class="page-sub">Select a station to begin your challenge!</p>
    </header>

    <main class="container">
        <div class="games-grid">
          
          <a href="game_memory.html" class="game-card">
            <div class="game-icon-wrap">
              <img src="assets/120mg_Pack.png" alt="Memory Game" class="game-icon">
            </div>
            <div class="game-title">Station 1<br><span style="font-size: 1rem; color: var(--muted); font-weight: 500;">Memory Game</span></div>
            <div class="play-badge">Play</div>
          </a>

          <a href="game_pacman.html" class="game-card">
            <div class="game-icon-wrap">
              <img src="assets/pacmanAsset.png" alt="Pac-Man" class="game-icon">
            </div>
            <div class="game-title">Station 2<br><span style="font-size: 1rem; color: var(--muted); font-weight: 500;">Pac-Man</span></div>
            <div class="play-badge">Play</div>
          </a>

          <!-- <a href="https://telfast-jeddah-gac-ai-photobooth.onrender.com" class="game-card">
            <div class="game-icon-wrap">
              <img src="assets/Cam.png" alt="AI Photobooth" class="game-icon" onerror="this.src='assets/GAC.png';">
            </div>
            <div class="game-title">Station 3<br><span style="font-size: 1rem; color: var(--muted); font-weight: 500;">AI Photobooth</span></div>
            <div class="play-badge">Enter</div>
          </a> -->

        </div>
    </main>

    <footer class="footer-disclaimer">
      PM-EG-CNT-26-00007
    </footer>
  </div>

</body>
</html>
